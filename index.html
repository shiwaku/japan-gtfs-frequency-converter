<!DOCTYPE html>
<!--
  build/bus_frequency.pmtiles のビューア。GitHub Pages のトップページを兼ねる。

  UI は shiwaku/mlit-urban-planning-converter の viewer に合わせてある（左パネル・
  テーマ切替・背景切替・レイヤーごとのトグル/不透明度/凡例）。あちらは Vite + TS だが、
  こちらは Pages のトップに置く1枚もので、ビルド工程を持たないため単一ファイルのまま。

  PMTiles は HTTP Range を使うので、ローカルで開くときは file:// ではなく
  同梱のサーバ経由で。GitHub Pages は Range に対応しているのでそのまま動く。

    python3 src/serve.py &
    open http://127.0.0.1:8787/
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>全国バス運行頻度図</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="description" content="全国のバスGTFSから集計した平日の区間別運行本数（gtfs-data.jp と ODPT の648フィード / 85,553区間）">
<meta name="theme-color" content="#2a78d6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cg stroke-linecap='round' fill='none'%3E%3Cpath d='M2 12h12' stroke='%239e1901' stroke-width='3'/%3E%3Cpath d='M3 8h10' stroke='%23bc3181' stroke-width='2'/%3E%3Cpath d='M4 4h8' stroke='%2385b4f0' stroke-width='1.2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --surface-solid: #ffffff;
    --ink: #14161a;
    --ink-2: #5a6069;
    --ink-3: #8b919b;
    --line: rgba(20, 22, 26, .10);
    --line-2: rgba(20, 22, 26, .16);
    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --track: rgba(20, 22, 26, .14);
    --hover: rgba(20, 22, 26, .05);
    --shadow: 0 10px 30px -10px rgba(16,24,40,.35), 0 2px 8px -4px rgba(16,24,40,.2);
    --radius-sm: 10px;
    color-scheme: light;
  }
  :root[data-theme='dark'] {
    --surface-solid: #1b1e24;
    --ink: #f2f4f7;
    --ink-2: #b3b9c4;
    --ink-3: #7d838e;
    --line: rgba(255, 255, 255, .10);
    --line-2: rgba(255, 255, 255, .16);
    --accent: #4f97f0;
    --accent-ink: #0a0c10;
    --track: rgba(255, 255, 255, .16);
    --hover: rgba(255, 255, 255, .07);
    --shadow: 0 12px 32px -10px rgba(0,0,0,.6), 0 2px 8px -4px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', 'Hiragino Kaku Gothic ProN', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #map { position: absolute; inset: 0; }

  /* ---- パネル ---- */
  .panel {
    position: absolute; top: 0; left: 0; bottom: 0; z-index: 2;
    display: flex; flex-direction: column;
    width: 300px; max-width: 88vw;
    /* すりガラス（backdrop-filter）は使わない。内部スクロールを持つパネルで
       合成が破綻することがあるため、不透明背景にする。 */
    background: var(--surface-solid);
    border-right: 1px solid var(--line);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .panel.collapsed { bottom: auto; height: auto; }

  .panel-head {
    flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 12px 12px 12px 14px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .brand-mark { font-size: 18px; line-height: 1; }
  .panel h1 { margin: 0; font-size: 14px; font-weight: 700; line-height: 1.25; }
  .head-actions { display: flex; gap: 4px; }

  .icon-btn {
    width: 30px; height: 30px; display: grid; place-items: center; padding: 0;
    border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--ink-2);
    font-size: 15px; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }

  .panel-body {
    flex: 1 1 auto; min-height: 0;
    padding: 14px;
    display: grid; gap: 16px; align-content: start;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .panel.collapsed .panel-body,
  .panel.collapsed .panel-foot { display: none; }

  .field { display: grid; gap: 8px; }
  .field-label {
    font-size: 11px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--ink-3);
  }

  /* ---- レイヤートグル ---- */
  .toggles { display: grid; gap: 2px; }
  .layer-item { display: grid; gap: 2px; }
  .toggle {
    /* 中の checkbox（視覚非表示）をこのラベル内に閉じ込める。基準がスクロール領域の
       外に出ると、フォーカス移動時にパネルのスクロールが壊れる。 */
    position: relative;
    display: flex; align-items: center; gap: 10px;
    padding: 7px 8px; border-radius: var(--radius-sm);
    cursor: pointer; transition: background .15s ease;
  }
  .toggle:hover { background: var(--hover); }
  .toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .toggle .t-label { flex: 0 1 auto; min-width: 0; font-size: 13px; }

  .switch {
    position: relative; flex: none;
    width: 34px; height: 20px; border-radius: 999px;
    background: var(--track); transition: background .18s ease;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3);
    transition: transform .18s ease;
  }
  .toggle input:checked + .switch { background: var(--accent); }
  .toggle input:checked + .switch::after { transform: translateX(14px); }
  .toggle input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }

  .info-btn {
    flex: none; width: 16px; height: 16px; display: grid; place-items: center; padding: 0;
    border: 1px solid var(--line-2); border-radius: 50%;
    background: transparent; color: var(--ink-3);
    font: italic 700 10px/1 Georgia, 'Times New Roman', serif;
    cursor: pointer; transition: background .15s ease, color .15s ease;
  }
  .info-btn:hover { background: var(--hover); color: var(--ink); }
  .info-btn[aria-expanded='true'] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .layer-desc { padding: 2px 8px 6px 44px; font-size: 11.5px; line-height: 1.65; color: var(--ink-2); }
  .layer-desc[hidden] { display: none; }

  .layer-opacity { display: flex; align-items: center; gap: 8px; padding: 0 8px 4px 44px; }
  .layer-opacity[hidden] { display: none; }
  .layer-opacity input[type='range'] { flex: 1; height: 8px; accent-color: var(--accent); cursor: pointer; }
  .op-val { flex: none; width: 34px; text-align: right; font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  /* ---- 各レイヤー直下のインライン凡例 ---- */
  .layer-legend { display: grid; gap: 4px; padding: 2px 8px 6px 44px; }
  .layer-legend[hidden] { display: none; }
  .lg-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  /* 便数の凡例は線そのものを見せたいので、太さも本文と同じ比率で描く */
  .lg-bar { flex: none; width: 34px; border-radius: 3px; }
  .lg-dot { flex: none; width: 9px; height: 9px; border-radius: 50%; }
  .lg-note { font-size: 11px; color: var(--ink-3); }

  .panel-foot {
    flex: none; padding: 12px 14px;
    font-size: 10.5px; line-height: 1.55; color: var(--ink-3);
    border-top: 1px solid var(--line);
  }
  .panel-foot a { color: var(--accent); text-decoration: none; }
  .panel-foot a:hover { text-decoration: underline; }

  /* ---- ポップアップ（MapLibre 上書き） ---- */
  .maplibregl-popup-content {
    background: var(--surface-solid); color: var(--ink);
    border: 1px solid var(--line-2); border-radius: 12px;
    box-shadow: var(--shadow); padding: 12px 14px; font: inherit;
  }
  .maplibregl-popup-close-button { color: var(--ink-3); font-size: 18px; padding: 2px 7px; }
  .maplibregl-popup-tip { display: none; }
  .pp-title { font-size: 14px; font-weight: 700; }
  .pp-sub { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
  .pp-dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 9px 0 0; }
  .pp-dl dt { color: var(--ink-2); font-size: 12px; }
  .pp-dl dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .pp-dl dd.pp-strong { color: var(--accent); font-size: 15px; }
  .pp-foot { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 11px; color: var(--ink-3); }

  /* ---- 背景地図スイッチャー（右下） ---- */
  .basemap-switch {
    display: flex; gap: 2px; padding: 3px;
    background: var(--surface-solid);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    box-shadow: var(--shadow);
  }
  .basemap-switch button {
    appearance: none; border: 0; background: transparent; color: var(--ink-2);
    font: inherit; font-weight: 600; font-size: 12px;
    padding: 5px 12px; border-radius: 7px; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .basemap-switch button:hover { color: var(--ink); }
  .basemap-switch button[aria-selected='true'] { background: var(--accent); color: var(--accent-ink); }

  /* ---- MapLibre コントロールの馴染ませ ---- */
  .maplibregl-ctrl-group { background: var(--surface-solid); border-radius: 10px; box-shadow: var(--shadow); }
  .maplibregl-ctrl-attrib { font-size: 10px; }

  /* ---- レスポンシブ（モバイルはボトムシート） ---- */
  @media (max-width: 640px) {
    .panel {
      top: auto; left: 0; right: 0; bottom: 0;
      width: auto; max-width: none; height: auto; max-height: 62dvh;
      border: none; border-top: 1px solid var(--line);
    }
    /* デスクトップ用の bottom:auto を打ち消す。畳んでも下端固定を保つ */
    .panel.collapsed { max-height: none; bottom: 0; }
    .panel-head { padding: 14px 12px; }
    .panel-foot { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
    /* 畳んだパネルのヘッダ分だけ地図コントロールを持ち上げる */
    .maplibregl-ctrl-bottom-right,
    .maplibregl-ctrl-bottom-left { margin-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
    .toggle { padding: 9px 8px; }
    .info-btn { width: 20px; height: 20px; font-size: 12px; }
    .basemap-switch button { padding: 7px 14px; }
    .maplibregl-ctrl-top-right { margin-top: env(safe-area-inset-top, 0px); }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="map"></div>

<section id="panel" class="panel" aria-label="コントロールパネル">
  <header class="panel-head">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🚌</span>
      <h1>全国バス運行頻度図</h1>
    </div>
    <div class="head-actions">
      <button id="theme-btn" class="icon-btn" type="button" title="テーマ切替" aria-label="テーマ切替"></button>
      <button id="collapse-btn" class="icon-btn" type="button" title="パネル開閉" aria-label="パネル開閉"></button>
    </div>
  </header>

  <div id="panel-body" class="panel-body">
    <div class="field">
      <span class="field-label">レイヤー</span>
      <div id="layers" class="toggles"></div>
    </div>
  </div>

  <footer class="panel-foot">
    出典: <a href="https://gtfs-data.jp/" target="_blank" rel="noopener">GTFSデータリポジトリ</a>・<a href="https://ckan.odpt.org/" target="_blank" rel="noopener">公共交通オープンデータセンター</a><br>
    平日1日の便数を停留所間の区間ごとに集計（648フィード / 85,553区間）<br>
    <a href="https://github.com/shiwaku/japan-gtfs-frequency-converter" target="_blank" rel="noopener">生成コード（GitHub）</a>
  </footer>
</section>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<script>
// ---- 運行本数の配色 ----
// 便数の分布は 1-5:21% / 6-11:27% / 12-23:24% / 24-47:14% / 48-95:6.8% / 96+:6.9%。
// 等間隔ではなくおおよそ倍々で刻む。太さも同じ階級で変え、色と二重に符号化する。
//
// 寒色→暖色（少ない=青 / 多い=赤）。単一色相の濃淡だと、便数の多い区間が集まる都市部で
// 上位3階級がひとかたまりの濃紺に見えてしまい、幹線がどこかを読めなかった。色相を振ると
// 24–47 と 48–95 の境目が線の太さに頼らず分かる。
//
// 明度は OKLCH で単調に下降させてあり（明 0.76 → 暗 0.45）、色相だけに頼らないので
// 色覚特性やモノクロ印刷でも順序は保たれる。最も薄い階級も地色に対して 2.09:1 あり、
// 旧配色（1.50:1）で全体の21%を占める「1–5便」がほぼ見えなかった問題も解消している。
const BREAKS = [6, 12, 24, 48, 96];
const LABELS = ['1–5', '6–11', '12–23', '24–47', '48–95', '96+'];
const RAMP = {
  // 明るい地図: 低頻度ほど淡い青、幹線ほど濃い赤
  light: ['#85b4f0', '#888dec', '#a95ec8', '#bc3181', '#ba022f', '#9e1901'],
  // 暗い地図・写真: 明度の向きを反転（地色に近い＝低頻度）。色相の並びは同じ
  dark:  ['#234c88', '#6359b5', '#a95cbb', '#e6659e', '#fd8c7b', '#fec583'],
};
// 色だけでは細線の判別が難しいので、太さの幅も広くとる
const WIDTHS = [0.6, 1.0, 1.6, 2.4, 3.6, 5.4];

const PMTILES_URL = new URL('build/bus_frequency.pmtiles', location.href).href;
const DATA_ATTRIBUTION =
  '<a href="https://gtfs-data.jp/" target="_blank" rel="noopener">GTFSデータリポジトリ</a> | ' +
  '<a href="https://ckan.odpt.org/" target="_blank" rel="noopener">公共交通オープンデータセンター</a>';
// 日本語ラベル用のグリフ（地理院 最適化ベクトルタイルのものを借りる）
const GLYPHS = 'https://gsi-cyberjapan.github.io/optimal_bvmap/glyphs/{fontstack}/{range}.pbf';
const FONT = ['NotoSansJP-Regular'];

// ---- テーマ ----
const THEME_KEY = 'bus-frequency-theme';
const params = new URLSearchParams(location.search);
const systemTheme = () => matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
function initialTheme() {
  const q = params.get('theme');                       // ?theme=dark は従来どおり効かせる
  if (q === 'light' || q === 'dark') return q;
  const saved = localStorage.getItem(THEME_KEY);
  return saved === 'light' || saved === 'dark' ? saved : systemTheme();
}
let theme = initialTheme();
let base = 'map';   // 'map' | 'photo'
function applyThemeAttr(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_KEY, t); } catch (_) {}
}
applyThemeAttr(theme);

// 写真の上では暗い地図と同じ「明るい線」の向きにする
const isDarkCanvas = () => theme === 'dark' || base === 'photo';
const colors = () => isDarkCanvas() ? RAMP.dark : RAMP.light;

// ---- レイヤー定義 ----
const LAYERS = [
  {
    key: 'routes', name: '区間の運行本数', geom: 'line', on: true, opacity: 0.9,
    desc: '停留所どうしの区間を、平日1日の便数（両方向の合計）で6段階に塗り分けます。色が濃く太いほど本数が多い区間です。',
  },
  {
    key: 'stops', name: '停留所', geom: 'circle', on: true, opacity: 0.5,
    desc: 'GTFS の停留所。同名かつ近接するものは1つにまとめてあります。z11 以上で表示。',
  },
  {
    key: 'stop-labels', name: '停留所名', geom: 'symbol', on: true, opacity: 1,
    desc: 'z14 で停留所名を表示します。重なる場合は停車回数の多い停留所を優先します。',
  },
];
const defOf = (key) => LAYERS.find((d) => d.key === key);

// step 式: [色0, 閾値0, 色1, 閾値1, ...]
const stepExpr = (vals) => {
  const e = ['step', ['get', 'frequency'], vals[0]];
  BREAKS.forEach((b, i) => e.push(b, vals[i + 1]));
  return e;
};

// ---- 背景地図 ----
function baseSourceAndLayers() {
  if (base === 'photo') {
    return {
      sources: {
        base: {
          type: 'raster', tileSize: 256, maxzoom: 18,
          tiles: ['https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg'],
          attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル（全国最新写真）</a>',
        },
      },
      layers: [{ id: 'base', type: 'raster', source: 'base' }],
    };
  }
  const url = theme === 'dark'
    ? 'https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'
    : 'https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png';
  return {
    sources: {
      base: {
        type: 'raster', tileSize: 256, maxzoom: 18, tiles: [url],
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      },
    },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': theme === 'dark' ? '#12141a' : '#ffffff' } },
      { id: 'base', type: 'raster', source: 'base',
        paint: { 'raster-opacity': theme === 'dark' ? 0.55 : 0.7, 'raster-saturation': -0.9 } },
    ],
  };
}

function dataLayers() {
  const c = colors();
  const ink = isDarkCanvas() ? '#f2f4f7' : '#14161a';
  const halo = base === 'photo' ? 'rgba(0,0,0,.75)' : (theme === 'dark' ? 'rgba(12,14,18,.85)' : 'rgba(255,255,255,.9)');
  return [
    {
      id: 'stops', type: 'circle', source: 'bus', 'source-layer': 'stops', minzoom: 10,
      paint: {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 1.1, 14, 2.8],
        'circle-color': ink,
        'circle-opacity': defOf('stops').opacity,
      },
    },
    {
      id: 'routes', type: 'line', source: 'bus', 'source-layer': 'routes',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: {
        'line-color': stepExpr(c),
        // 低ズームでは幹線しか出ず、1区間が数百 m しかないので、細くすると消える。1px 強を下限にする。
        'line-width': [
          'interpolate', ['linear'], ['zoom'],
          4, ['max', ['*', stepExpr(WIDTHS), 0.45], 1.2],
          6, ['max', ['*', stepExpr(WIDTHS), 0.7], 1.0],
          9, stepExpr(WIDTHS),
          13, ['*', stepExpr(WIDTHS), 1.8],
        ],
        'line-opacity': defOf('routes').opacity,
      },
    },
    {
      // 停留所名。z14（最大ズーム）でのみ出す。重なりは MapLibre に間引かせ、
      // 停車回数の多い停留所が残るように sort-key を効かせる。
      id: 'stop-labels', type: 'symbol', source: 'bus', 'source-layer': 'stops', minzoom: 14,
      layout: {
        'text-field': ['get', 'name'],
        'text-font': FONT,
        'text-size': 11,
        'text-offset': [0, 0.9],
        'text-anchor': 'top',
        'text-max-width': 8,
        'text-padding': 3,
        'symbol-sort-key': ['-', 0, ['coalesce', ['get', 'count'], 0]],
      },
      paint: {
        'text-color': ink,
        'text-halo-color': halo,
        'text-halo-width': 1.4,
        'text-opacity': defOf('stop-labels').opacity,
      },
    },
  ];
}

function buildStyle() {
  const b = baseSourceAndLayers();
  return {
    version: 8,
    glyphs: GLYPHS,
    sources: Object.assign({}, b.sources, {
      bus: {
        type: 'vector',
        // 相対解決にしておくと、ローカル (/) でも Pages (/<repo>/) でも同じ記述で通る
        url: 'pmtiles://' + PMTILES_URL,
        attribution: DATA_ATTRIBUTION,
      },
    }),
    layers: b.layers.concat(dataLayers()),
  };
}

maplibregl.addProtocol('pmtiles', new pmtiles.Protocol().tile);

const isMobile = matchMedia('(max-width: 640px)').matches;
const map = new maplibregl.Map({
  container: 'map',
  hash: true,
  center: [138.0, 37.0],
  zoom: 5,
  attributionControl: false,
  style: buildStyle(),
});

map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
map.addControl(new maplibregl.GeolocateControl({
  positionOptions: { enableHighAccuracy: true },
  trackUserLocation: true,
}), 'top-right');
map.addControl(new maplibregl.ScaleControl({ maxWidth: 120 }), 'bottom-left');
map.addControl(new maplibregl.AttributionControl({ compact: true }));

// スタイルを丸ごと差し替える。ラスタ（写真）↔ラスタ（淡色）でも diff 適用だと
// 背景が入れ替わらないことがあるので diff:false で作り直す。
function reloadStyle() {
  map.setStyle(buildStyle(), { diff: false });
  map.once('idle', applyLayerState);
}

// ---- テーマ切替 ----
const themeBtn = document.getElementById('theme-btn');
const renderThemeBtn = () => { themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙'; };
themeBtn.addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  applyThemeAttr(theme);
  renderThemeBtn();
  renderLegends();
  reloadStyle();
});

// ---- パネル開閉 ----
const panel = document.getElementById('panel');
const collapseBtn = document.getElementById('collapse-btn');
const renderCollapseBtn = () => {
  collapseBtn.textContent = panel.classList.contains('collapsed') ? '▾' : '▴';
};
collapseBtn.addEventListener('click', () => {
  panel.classList.toggle('collapsed');
  renderCollapseBtn();
});

// ---- レイヤートグル（凡例は各レイヤーの直下にインライン表示） ----
const layersDiv = document.getElementById('layers');

function legendMarkup(def) {
  if (def.key === 'routes') {
    const c = colors();
    return LABELS.map((l, i) =>
      `<span class="lg-row"><span class="lg-bar" style="height:${Math.max(WIDTHS[i], 2)}px;background:${c[i]}"></span>${l}</span>`
    ).join('') + '<span class="lg-note">便/日（両方向計）</span>';
  }
  if (def.key === 'stops') {
    const ink = isDarkCanvas() ? '#f2f4f7' : '#14161a';
    return `<span class="lg-row"><span class="lg-dot" style="background:${ink}"></span>停留所（z11以上）</span>`;
  }
  return '<span class="lg-row">z14 で表示</span>';
}

function renderLegends() {
  for (const def of LAYERS) {
    const el = layersDiv.querySelector(`.layer-item[data-key="${def.key}"] .layer-legend`);
    if (el) el.innerHTML = legendMarkup(def);
  }
}

function buildToggles() {
  for (const def of LAYERS) {
    const item = document.createElement('div');
    item.className = 'layer-item';
    item.dataset.key = def.key;

    const label = document.createElement('label');
    label.className = 'toggle';

    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = def.on;
    input.addEventListener('change', () => setLayerVisible(def, input.checked));

    const sw = document.createElement('span');
    sw.className = 'switch';
    const text = document.createElement('span');
    text.className = 't-label';
    text.textContent = def.name;

    const desc = document.createElement('div');
    desc.className = 'layer-desc';
    desc.hidden = true;
    desc.textContent = def.desc;

    const info = document.createElement('button');
    info.type = 'button';
    info.className = 'info-btn';
    info.textContent = 'i';
    info.setAttribute('aria-label', `${def.name}の説明`);
    info.setAttribute('aria-expanded', 'false');
    info.addEventListener('click', (e) => {
      // label 内のボタン。クリックが checkbox のトグルへ波及しないようにする
      e.preventDefault();
      e.stopPropagation();
      const open = desc.hidden;
      desc.hidden = !open;
      info.setAttribute('aria-expanded', String(open));
    });

    label.append(input, sw, text, info);

    const opac = document.createElement('div');
    opac.className = 'layer-opacity';
    opac.hidden = !def.on;
    const range = document.createElement('input');
    range.type = 'range';
    range.min = '0'; range.max = '1'; range.step = '0.05';
    range.value = String(def.opacity);
    range.setAttribute('aria-label', `${def.name}の不透明度`);
    const val = document.createElement('span');
    val.className = 'op-val';
    val.textContent = `${Math.round(def.opacity * 100)}%`;
    range.addEventListener('input', () => {
      const v = Number(range.value);
      val.textContent = `${Math.round(v * 100)}%`;
      setLayerOpacity(def, v);
    });
    opac.append(range, val);

    const legend = document.createElement('div');
    legend.className = 'layer-legend';
    legend.hidden = !def.on;

    item.append(label, desc, opac, legend);
    layersDiv.append(item);
  }
  renderLegends();
}

const OPACITY_PROP = { line: 'line-opacity', circle: 'circle-opacity', symbol: 'text-opacity' };

function setLayerVisible(def, on) {
  def.on = on;
  if (map.getLayer(def.key)) {
    map.setLayoutProperty(def.key, 'visibility', on ? 'visible' : 'none');
  }
  const item = layersDiv.querySelector(`.layer-item[data-key="${def.key}"]`);
  item.querySelector('.layer-legend').toggleAttribute('hidden', !on);
  item.querySelector('.layer-opacity').toggleAttribute('hidden', !on);
}

function setLayerOpacity(def, v) {
  def.opacity = v;
  if (map.getLayer(def.key)) map.setPaintProperty(def.key, OPACITY_PROP[def.geom], v);
}

// スタイル差し替え後に、トグル/不透明度の状態を貼り直す
function applyLayerState() {
  for (const def of LAYERS) {
    if (!map.getLayer(def.key)) continue;
    map.setLayoutProperty(def.key, 'visibility', def.on ? 'visible' : 'none');
    map.setPaintProperty(def.key, OPACITY_PROP[def.geom], def.opacity);
  }
}

// ---- 背景地図スイッチャー（右下） ----
class BasemapControl {
  onAdd() {
    this.el = document.createElement('div');
    this.el.className = 'maplibregl-ctrl basemap-switch';
    for (const [b, label] of [['map', '地図'], ['photo', '写真']]) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = label;
      btn.dataset.base = b;
      btn.setAttribute('aria-selected', String(b === base));
      btn.addEventListener('click', () => setBase(b));
      this.el.append(btn);
    }
    return this.el;
  }
  onRemove() { this.el.remove(); }
  sync() {
    for (const btn of this.el.querySelectorAll('button')) {
      btn.setAttribute('aria-selected', String(btn.dataset.base === base));
    }
  }
}
const basemapCtrl = new BasemapControl();
map.addControl(basemapCtrl, 'bottom-right');

function setBase(next) {
  if (next === base) return;
  base = next;
  basemapCtrl.sync();
  renderLegends();   // 写真の上では線の向き（明暗）が変わる
  reloadStyle();
}

// ---- ポップアップ ----
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function routeHtml(p) {
  return `<div class="pp-title">${esc(p.stop_a)} ⇄ ${esc(p.stop_b)}</div>` +
    '<div class="pp-sub">区間の運行本数（平日・両方向計）</div>' +
    '<dl class="pp-dl">' +
    `<dt>便/日</dt><dd class="pp-strong">${esc(p.frequency)}</dd>` +
    `<dt>→ ${esc(p.stop_b)}</dt><dd>${esc(p.frequency_ab)}</dd>` +
    `<dt>← ${esc(p.stop_a)}</dt><dd>${esc(p.frequency_ba)}</dd>` +
    `<dt>事業者</dt><dd>${esc(p.operators)}</dd>` +
    `<dt>系統</dt><dd>${esc(p.routes)}</dd>` +
    '</dl>' +
    `<div class="pp-foot">${esc(p.agency)}</div>`;
}

function stopHtml(p) {
  return `<div class="pp-title">${esc(p.name)}</div>` +
    '<div class="pp-sub">停留所</div>' +
    '<dl class="pp-dl">' +
    `<dt>停車回数/日</dt><dd class="pp-strong">${esc(p.count)}</dd>` +
    `<dt>事業者</dt><dd>${esc(p.operators)}</dd>` +
    '</dl>' +
    `<div class="pp-foot">${esc(p.agency)}</div>`;
}

// 上にあるものから拾う。停留所は点なので、線より優先して当てる。
const HIT_LAYERS = ['stops', 'routes'];
const hitFeature = (pt) => {
  const ids = HIT_LAYERS.filter((id) => map.getLayer(id) && defOf(id).on);
  if (!ids.length) return null;
  const f = map.queryRenderedFeatures(pt, { layers: ids });
  return f.length ? f[0] : null;
};
const htmlFor = (f) => f.layer.id === 'stops' ? stopHtml(f.properties) : routeHtml(f.properties);

if (matchMedia('(hover: hover)').matches) {
  // マウス環境: ホバーで追従する軽いポップアップ（区間の方向別内訳をすぐ見たい）
  const hoverPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 10, maxWidth: '280px' });
  map.on('mousemove', (e) => {
    const f = hitFeature(e.point);
    map.getCanvas().style.cursor = f ? 'pointer' : '';
    if (!f) { hoverPopup.remove(); return; }
    hoverPopup.setLngLat(e.lngLat).setHTML(htmlFor(f)).addTo(map);
  });
  map.on('mouseout', () => hoverPopup.remove());
} else {
  // タッチ環境: タップで閉じるボタン付きのポップアップ
  let popup = null;
  map.on('click', (e) => {
    const f = hitFeature(e.point);
    if (popup) { popup.remove(); popup = null; }
    if (!f) return;
    popup = new maplibregl.Popup({ closeButton: true, maxWidth: '280px' })
      .setLngLat(e.lngLat).setHTML(htmlFor(f)).addTo(map);
  });
}

// ---- 初期化 ----
renderThemeBtn();
buildToggles();
if (isMobile) panel.classList.add('collapsed');   // スマホは畳んで地図を広く見せる
renderCollapseBtn();
map.on('load', applyLayerState);

// スクリーンショット用: タイル読み込み完了を外から待てるようにする
window.__idle = false;
map.on('idle', () => { window.__idle = true; });
</script>
</body>
</html>
